changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security and reliability
      labels:
        - security
        - reliability
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
