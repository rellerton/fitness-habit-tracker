name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Database integrity and migration tests
        run: npm run test:database

      - name: Initialize smoke-test database
        run: |
          mkdir -p data
          npx prisma migrate deploy

      - name: API smoke tests
        run: |
          npm run start > /tmp/fitness-habit-tracker.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          npm run test:smoke

      - name: Add-on ingress and process-supervision tests
        run: bash scripts/test-addon-runtime.sh

      - name: Install Chromium for UI tests
        run: npx playwright install --with-deps chromium

      - name: Accessibility and responsive UI tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start > /tmp/fitness-habit-tracker-ui.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          npm run test:ui
