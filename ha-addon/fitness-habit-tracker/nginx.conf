# If ingress is present, keep "./_next" as-is; if direct access, rewrite to "/_next".
map $ingress_prefix $direct_next_prefix {
    ""      "";
    default ".";
}

# Cache only content-addressed Next.js assets for the long term. API responses
# are never cached; HTML and other application responses must be revalidated.
map $upstream_path $response_cache_control {
    ~^/_next/static/ "public, max-age=31536000, immutable";
    ~^/api/          "no-store";
    default          "no-cache";
}

upstream nextjs {
    server 127.0.0.1:3001;
}

server {
    listen 3000;
    absolute_redirect off;

    # Supervisor supplies the external mount path while forwarding an internal
    # path such as "/" or "/people" to the add-on.
    set $ingress_path $http_x_ingress_path;

    # Treat "/" as "no ingress prefix"
    if ($ingress_path = "/") { set $ingress_path ""; }

    # Avoid double slashes in rewrites when ingress path is empty
    set $ingress_prefix $ingress_path;

    location / {
        # Supervisor already strips its external ingress prefix.
        set $upstream_path $uri;

        # Normalize nested Next asset paths (e.g. /people/_next/...) to /_next/...
        if ($upstream_path ~ "^/.*/_next/(.*)$") {
            set $upstream_path "/_next/$1";
        }

        # CORS for HA iframe dashboards (sandboxed iframes use "null" origin)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Make upstream send uncompressed so sub_filter can work
        proxy_set_header Accept-Encoding "";
        gunzip on;

        proxy_hide_header Cache-Control;
        add_header Cache-Control $response_cache_control always;

        # ----------------------------
        # 2) OUTBOUND REWRITE (ONLY WHAT WE MUST)
        # ----------------------------
        sub_filter_once off;

        # Nginx applies sub_filter to text/html by default. Next's runtime also
        # embeds its asset base in JavaScript, so rewrite JavaScript as well.
        # Do not list text/html here: it is already the default and doing so
        # produces a duplicate MIME-type warning.
        sub_filter_types application/javascript text/javascript;

        # Rewrite Next assets to live under the ingress mount
        sub_filter "\"/_next/" "\"$ingress_prefix/_next/";
        sub_filter "'/_next/" "'$ingress_prefix/_next/";
        sub_filter "\"./_next/" "\"$direct_next_prefix/_next/";
        sub_filter "'./_next/" "'$direct_next_prefix/_next/";


        # WebSocket headers (harmless)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Strip the add-on's internal origin and apply the ingress prefix. Next.js
        # may emit either an absolute or root-relative Location header.
        proxy_redirect ~^https?://[^/]+(/.*)$ $ingress_prefix$1;
        proxy_redirect ~^(/.*)$ $ingress_prefix$1;

        # IMPORTANT: because proxy_pass uses variables, we must include the full URI ourselves
        proxy_pass http://nextjs$upstream_path$is_args$args;
    }
}
